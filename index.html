<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Gassenpfoten – The Cats of Tübingen. A calm, cozy cat game." />
    <meta name="theme-color" content="#1d2433" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- In index.html, Vite rewrites root paths to include the base path (/gassenpfoten/).
         In TypeScript, always use assetUrl() from src/config.ts instead. -->
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <title>Gassenpfoten – The Cats of Tübingen</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1d2433;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Keep the game clear of notches and the home indicator on phones. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      canvas { display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
